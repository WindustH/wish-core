[package]
name = "wish-core"
version = "0.2.0"
edition = "2024"
description = "Self-hosted agent server: durable sessions, shell tools and many model providers in one binary"
license = "MIT"
repository = "https://github.com/WindustH/wish-core"
readme = "README.md"
publish = false

[[bin]]
name = "wish"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
lru = "0.18.2"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2.0.20"
# Parses the HTTP-date form of a `retry-after` header.
httpdate = "1"
# The application owns the runtime; built-in tools use its process and file I/O facilities.
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "net", "signal", "process", "fs", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
# Byte-level stream reading, for bodies that must stay under a ceiling while being read.
futures-util = "0.3"
# HTTP client. `default-features = false` on purpose: rustls instead of system OpenSSL and `stream`
# for SSE bodies, with no auto-decompression, no HTTP/2 and no platform proxy detection until asked.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# AWS SigV4 request signing: the digests, and the HMAC-SHA256 chain a signature is made of.
sha2 = "0.10"
hmac = "0.12"
# Lowercase hex, for the SHA-256 digests a signature spells its pieces with.
hex = "0.4"
# Base64 for inline media and the PKCE challenge of a browser login.
base64 = "0.22"
imara-diff = { version = "0.2", features = ["unified_diff"] }
# MCP client: the protocol, local servers over stdio and the Streamable HTTP session logic. Its own
# reqwest client stays off: remote servers are reached through wish's, under the same proxy policy.
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client"] }
# The SSE records rmcp's HTTP transport reads, parsed from wish's own response bodies.
sse-stream = "0.2"
# Starts a local MCP server in a process group of its own (a job object on Windows), so closing it
# ends whatever it started too - `npx` and the server behind it.
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
