[package]
name = "wish-core"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wish"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
lru = "0.18.2"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2.0.20"
# Parses the HTTP-date form of a `retry-after` header.
httpdate = "1"
# The application owns the runtime; built-in tools use its process and file I/O facilities.
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "net", "signal", "process", "fs", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
# Byte-level stream reading, for bodies that must stay under a ceiling while being read.
futures-util = "0.3"
# HTTP client. `default-features = false` on purpose: rustls instead of system OpenSSL and `stream`
# for SSE bodies, with no auto-decompression, no HTTP/2 and no platform proxy detection until asked.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# AWS SigV4 request signing: the digests, and the HMAC-SHA256 chain a signature is made of.
sha2 = "0.10"
hmac = "0.12"
# Lowercase hex, for the SHA-256 digests a signature spells its pieces with.
hex = "0.4"
# Google ADC service-account keys sign their token assertions with RS256, and their PEM bodies
# decode as base64. Both routines are the ones the TLS stack already compiles under reqwest's
# rustls, so nothing new enters the tree.
ring = "0.17"
base64 = "0.22"
imara-diff = { version = "0.2", features = ["unified_diff"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
